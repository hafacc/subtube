# Cut a release of every chosen app in one go, each with the same bump, and publish main's
# web app. Each app is its own cut-app.yml, one after another on the `cut` lock, so their
# tags land minutes apart: of an ios and a macos tag pushed in the same second, Xcode Cloud
# built only the last. The web app tests itself.
name: cut

on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump
        type: choice
        options: [patch, minor, major]
        default: patch
      android:
        description: Android app
        type: boolean
        default: true
      ios:
        description: iOS app
        type: boolean
        default: true
      macos:
        description: macOS app
        type: boolean
        default: true
      extension:
        description: Chrome extension (each release goes through store review)
        type: boolean
        default: false
      web:
        description: deploy the web app
        type: boolean
        default: true

permissions: {}

jobs:
  android:
    if: inputs.android
    uses: ./.github/workflows/cut-app.yml
    with:
      app: android
      bump: ${{ inputs.bump }}
    # one cut at a time across every cut workflow, held from before the tests until the push
    concurrency:
      group: cut
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # push the bump + tag
      actions: write # start the publish
      pull-requests: read # build.yml asks for it; unused here
      checks: read # see that Xcode Cloud started

  ios:
    if: inputs.ios
    uses: ./.github/workflows/cut-app.yml
    with:
      app: ios
      bump: ${{ inputs.bump }}
    # one cut at a time across every cut workflow, held from before the tests until the push
    concurrency:
      group: cut
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # push the bump + tag
      actions: write # start the publish
      pull-requests: read # build.yml asks for it; unused here
      checks: read # see that Xcode Cloud started

  macos:
    if: inputs.macos
    uses: ./.github/workflows/cut-app.yml
    with:
      app: macos
      bump: ${{ inputs.bump }}
    # one cut at a time across every cut workflow, held from before the tests until the push
    concurrency:
      group: cut
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # push the bump + tag
      actions: write # start the publish
      pull-requests: read # build.yml asks for it; unused here
      checks: read # see that Xcode Cloud started

  extension:
    if: inputs.extension
    uses: ./.github/workflows/cut-app.yml
    with:
      app: extension
      bump: ${{ inputs.bump }}
    # one cut at a time across every cut workflow, held from before the tests until the push
    concurrency:
      group: cut
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # push the bump + tag
      actions: write # start the publish
      pull-requests: read # build.yml asks for it; unused here
      checks: read # see that Xcode Cloud started

  web:
    if: inputs.web
    uses: ./.github/workflows/web-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
