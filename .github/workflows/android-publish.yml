# Publish a tagged Android release: upload the signed bundle to Play's internal testing track as
# a draft and create the GitHub release. Started by android-cut.yml; run it by hand to retry a
# tag. Roll the draft out and promote it in the Play Console.
name: android-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish (e.g. android-v0.1.1)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: restore signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: base64 --decode <<< "$ANDROID_KEYSTORE" > "$RUNNER_TEMP/upload.jks"
      - name: upload to Play
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:publishReleaseBundle --release-status draft
          "-Psubtube.storeFile=$RUNNER_TEMP/upload.jks"
          "-Psubtube.storePassword=$STORE_PASSWORD"
          "-Psubtube.keyAlias=$KEY_ALIAS"
          "-Psubtube.keyPassword=$KEY_PASSWORD"
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ inputs.tag }}
        run: |
          # notes cover only what changed since the last Android release
          if previous=$(git describe --tags --abbrev=0 --match "android-v*" "$tag^" 2>/dev/null); then
            gh release create "$tag" --generate-notes --verify-tag --notes-start-tag "$previous"
          else
            gh release create "$tag" --generate-notes --verify-tag
          fi
