# Cut a release of the Android app: bump its version on main, tag it, then start
# android-publish.yml on the tag.
name: android-cut

on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions: {}

jobs:
  gate:
    uses: ./.github/workflows/build.yml
    with:
      only: android shared
    permissions:
      contents: read
      pull-requests: read # build.yml asks for it; unused here

  cut:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump + tag
      actions: write # start the publish
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the branch tip, not the dispatch SHA
      - name: bump version
        id: bump
        env:
          bump: ${{ inputs.bump }}
        # android/app/build.gradle.kts is the version source of truth
        run: |
          gradle=android/app/build.gradle.kts
          current=$(sed -nE 's/^ *versionName = "([^"]+)"/\1/p' "$gradle")
          code=$(sed -nE 's/^ *versionCode = ([0-9]+)/\1/p' "$gradle")
          IFS=. read -r major minor patch <<< "$current"
          case "$bump" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            *) version="$major.$minor.$((patch + 1))" ;;
          esac
          # Play rejects a versionCode it has already seen, so it only ever goes up
          sed -i -E \
            -e "s/^( *versionName = )\"[^\"]+\"/\1\"$version\"/" \
            -e "s/^( *versionCode = )[0-9]+/\1$((code + 1))/" \
            "$gradle"
          grep -F "versionName = \"$version\"" "$gradle"
          grep -F "versionCode = $((code + 1))" "$gradle"
          echo "tag=android-v$version" >> "$GITHUB_OUTPUT"
      - name: commit, tag and start the publish
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "android ${tag#android-}"
          # branch first, tag second (never --follow-tags): a moved main is rejected before the tag exists
          git push origin HEAD:main
          git tag -a "$tag" -m "android ${tag#android-}"
          git push origin "$tag"
          # a tag pushed with this token doesn't fire on:push, so start it directly
          gh workflow run android-publish.yml --ref main -f tag="$tag"
