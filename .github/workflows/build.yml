name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      only:
        description: jobs to run, space separated; all of them when empty
        type: string
        default: ""

jobs:
  # which of the jobs below run: on a pull request those whose folder it touches
  # (all of them when it touches shared/ or the workflows), the caller's `only`
  # when called, and otherwise all
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # list the pull request's files
    outputs:
      web: ${{ steps.pick.outputs.web }}
      extension: ${{ steps.pick.outputs.extension }}
      shared: ${{ steps.pick.outputs.shared }}
      android: ${{ steps.pick.outputs.android }}
      apple: ${{ steps.pick.outputs.apple }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: touched
        if: github.event_name == 'pull_request'
        with:
          filters: |
            all:
              - shared/**
              - .github/workflows/**
            web:
              - web/**
              - extension/** # web imports the extension's message types
            extension:
              - extension/**
            android:
              - android/**
            apple:
              - apple/**
      - id: pick
        env:
          event: ${{ github.event_name }}
          touched: ${{ steps.touched.outputs.changes }}
          only: ${{ inputs.only }}
        run: |
          for job in web extension shared android apple; do
            if [ "$event" = pull_request ]; then
              run=$(jq --arg job "$job" 'any(. == $job or . == "all")' <<< "$touched")
            elif [ -n "$only" ]; then
              case " $only " in *" $job "*) run=true ;; *) run=false ;; esac
            else
              run=true
            fi
            echo "$job=$run" >> "$GITHUB_OUTPUT"
          done

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build

  shared:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun tools/check.ts
      - run: bun run lint

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - run: ./gradlew :core:test :app:assembleDebug :app:lintDebug

  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    defaults:
      run:
        working-directory: apple/SubtubeCore
    steps:
      - uses: actions/checkout@v7
      - run: swift test
