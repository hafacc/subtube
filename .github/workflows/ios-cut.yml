# Cut a release of the iOS app: bump its version and tag it. Xcode Cloud builds from the tag.
name: ios-cut

on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions: {}

jobs:
  cut:
    uses: ./.github/workflows/cut-apps.yml
    with:
      bump: ${{ inputs.bump }}
      ios: true
    # one cut at a time across every cut workflow, held from before the tests until the push
    concurrency:
      group: cut
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # push the bump + tag
      actions: write # start the publish
      pull-requests: read # build.yml asks for it; unused here
