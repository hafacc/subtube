# Cut a release of one app: test main's tip, then bump, commit and tag the app on top of
# exactly that commit and start what publishes it. Called by cut.yml and the *-cut workflows.
# The calling job holds the `cut` lock from before the tests until the push, so
# no other cut lands in between; a main that moved for any other reason is refused by the
# push, before the tag exists.
name: cut-app

on:
  workflow_call:
    inputs:
      app:
        description: android, ios, macos or extension
        type: string
        required: true
      bump:
        description: semver bump (patch, minor or major)
        type: string
        default: patch

permissions: {}

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      only: ${{ steps.pin.outputs.only }}
    steps:
      - id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          app: ${{ inputs.app }}
        # main's tip now, not the dispatch SHA: a cut that waited its turn starts from the cuts before it
        run: |
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" >> "$GITHUB_OUTPUT"
          case "$app" in
            android) only="android shared" ;;
            ios | macos) only="apple shared" ;;
            extension) only="extension" ;;
            *)
              echo "::error::unknown app: $app"
              exit 1
              ;;
          esac
          echo "only=$only" >> "$GITHUB_OUTPUT"

  gate:
    needs: pin
    uses: ./.github/workflows/build.yml
    with:
      only: ${{ needs.pin.outputs.only }}
      ref: ${{ needs.pin.outputs.sha }}
    permissions:
      contents: read
      pull-requests: read # build.yml asks for it; unused here

  cut:
    needs: [pin, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump and tag
      actions: write # start the publish
      checks: read # see that Xcode Cloud started
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.sha }} # the commit the gate tested
      - uses: oven-sh/setup-bun@v2
        if: inputs.app == 'extension'
      - run: bun install --frozen-lockfile
        if: inputs.app == 'extension'
        working-directory: extension
      - name: bump, commit and tag
        id: bump
        env:
          app: ${{ inputs.app }}
          bump: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          next() {
            IFS=. read -r major minor patch <<< "$1"
            case "$bump" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "$major.$((minor + 1)).0" ;;
              *) echo "$major.$minor.$((patch + 1))" ;;
            esac
          }

          # apple/Config/Versions.xcconfig is the version source of truth, one line per platform
          apple() {
            config=apple/Config/Versions.xcconfig
            key="MARKETING_VERSION[sdk=$1*]"
            version=$(next "$(grep -F "$key = " "$config" | sed 's/.* = //')")
            sed -i "s/^MARKETING_VERSION\\[sdk=$1\\*\\] = .*/$key = $version/" "$config"
            grep -Fx "$key = $version" "$config"
          }

          case "$app" in
            android)
              # android/app/build.gradle.kts is the version source of truth
              gradle=android/app/build.gradle.kts
              version=$(next "$(sed -nE 's/^ *versionName = "([^"]+)"/\1/p' "$gradle")")
              code=$(sed -nE 's/^ *versionCode = ([0-9]+)/\1/p' "$gradle")
              # Play rejects a versionCode it has already seen, so it only ever goes up
              sed -i -E \
                -e "s/^( *versionName = )\"[^\"]+\"/\1\"$version\"/" \
                -e "s/^( *versionCode = )[0-9]+/\1$((code + 1))/" \
                "$gradle"
              grep -F "versionName = \"$version\"" "$gradle"
              grep -F "versionCode = $((code + 1))" "$gradle"
              ;;
            ios) apple iphone ;;
            macos) apple macosx ;;
            extension)
              # manifest.json is the version source of truth; package.json's version is unused (private, unpublished)
              manifest=extension/manifest.json
              version=$(next "$(jq -r .version "$manifest")")
              jq --arg version "$version" '.version = $version' "$manifest" > manifest.tmp
              mv manifest.tmp "$manifest"
              (cd extension && bunx biome format --write manifest.json)
              ;;
          esac

          git commit -am "$app v$version"
          git tag -a "$app-v$version" -m "$app v$version"
          echo "tag=$app-v$version" >> "$GITHUB_OUTPUT"
      - name: push and start the publish
        env:
          GH_TOKEN: ${{ github.token }}
          app: ${{ inputs.app }}
          tag: ${{ steps.bump.outputs.tag }}
        run: |
          # branch first, tag second (never --follow-tags): a main that is no longer the tested commit is rejected before the tag exists
          git push origin HEAD:main
          # Xcode Cloud watches the repository itself, so a token-pushed ios or macos tag starts its build
          git push origin "$tag"
          # a tag pushed with this token doesn't fire on:push, so start these directly
          case "$app" in
            android) gh workflow run android-publish.yml --ref main -f tag="$tag" ;;
            extension) gh workflow run ext-release.yml --ref main -f tag="$tag" ;;
          esac
      - name: check that Xcode Cloud started
        if: inputs.app == 'ios' || inputs.app == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ steps.bump.outputs.tag }}
        # Xcode Cloud puts a check on a tag's commit when it starts on it; a tag it never saw gets none
        run: |
          for _ in $(seq 20); do
            started=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag/check-runs" \
              --jq '[.check_runs[] | select(.app.name == "Xcode Cloud")] | length')
            if [ "$started" -gt 0 ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::Xcode Cloud did not start on $tag. Start that build by hand in App Store Connect, from the tag."
          exit 1
