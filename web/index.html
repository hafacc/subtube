<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      What this page may load: its own files, the inline theme script below (by its hash; src/lib/csp.test.ts fails when the two drift), YouTube's player script and frames, video and channel pictures, and Google's APIs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-VWx/62e7hhf1mz18aUvCHSiJoyXuhRYr02Xx/mQ8MLA=' https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.ytimg.com https://*.ggpht.com https://*.googleusercontent.com; connect-src 'self' https://www.googleapis.com; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubTube</title>
    <meta
      name="description"
      content="Your subscriptions, your filters, no algorithm."
    />
    <meta name="theme-color" content="#FFC20E" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        const theme = localStorage.getItem("subtube.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
